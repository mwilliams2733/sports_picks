database_path: "sports_picks.db"

seasons:
  nba:
    start: "10-22"
    end: "06-20"
  nfl:
    start: "09-05"
    end: "02-10"
  ncaab:
    start: "11-04"
    end: "04-08"
  ncaaf:
    start: "08-24"
    end: "01-20"
  boxing:
    start: "01-01"
    end: "12-31"
  mma:
    start: "01-01"
    end: "12-31"
  mlb:
    start: "03-27"
    end: "10-31"

odds_budget:
  monthly_limit: 20000
  daily_target: 600
  reserve: 2000

digest:
  enabled: true
  send_hour_et: 11
  sports: ["ncaaf", "nfl", "nba", "mlb"]
  max_per_sport: 5
  # Longest American price the email will show. Measured on the graded
  # book: picks longer than +200 win 16% of the time; favorites at -150 or
  # shorter win 73%. Picks past the ceiling are still generated and graded;
  # they are just not emailed. `null` disables the ceiling.
  max_odds: 150
  # Optional. When set (e.g. 0.50), a sport whose trailing 30-day record is
  # below this win rate on at least min_trailing_picks decided picks is left
  # out of the email. Off by default: with five graded NFL picks a record
  # is noise, and the reader can see the record in the header either way.
  # min_trailing_win_pct: 0.50
  # min_trailing_picks: 20
  from: "picks@example.com"   # placeholder -- must be a sender the transport accepts
  recipients:
    - "mwilliams2733@gmail.com"
    - "mlwilliams1236@gmail.com"
    - "atlasinventories2093@gmail.com"
    - "davidc1205@gmail.com"

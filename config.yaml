database_path: "sports_picks.db"

seasons:
  nba:
    start: "10-22"
    end: "06-20"
  nfl:
    start: "09-05"
    end: "02-10"
  ncaab:
    start: "11-04"
    end: "04-08"
  ncaaf:
    start: "08-24"
    end: "01-20"
  boxing:
    start: "01-01"
    end: "12-31"
  mma:
    start: "01-01"
    end: "12-31"
  mlb:
    start: "03-27"
    end: "10-31"

odds_budget:
  monthly_limit: 20000
  daily_target: 600
  reserve: 2000

digest:
  enabled: true
  send_hour_et: 11
  # Owner's enabled sports (2026-09-28): NFL, MLB, UFC ("mma" is the UFC key).
  # Around NBA opening night (2026-10-20) the plan is to swap mlb for nba.
  sports: ["nfl", "mlb", "mma"]
  send_bar:            # frozen 2026-09-29 (owner decision 2026-09-28); change only with a dated note
    min_shrunk_edge_pp: 3.0
    min_odds: -150
    max_odds: 150
    max_game_picks: 3
    max_props: 5
    blend_weight:      # lambda per sport, measured 2026-09-29 by backend.analysis.market_shrinkage (NFL 1,184 games, MLB 127; in-sample best 0.00 both)
      nfl: 0.00
      mlb: 0.00
  # Optional. When set (e.g. 0.50), a sport whose trailing 30-day record is
  # below this win rate on at least min_trailing_picks decided picks is left
  # out of the email. Off by default: with five graded NFL picks a record
  # is noise, and the reader can see the record in the header either way.
  # min_trailing_win_pct: 0.50
  # min_trailing_picks: 20
  from: "picks@example.com"   # placeholder -- must be a sender the transport accepts
  recipients:
    - "mwilliams2733@gmail.com"
    - "mlwilliams1236@gmail.com"
    - "atlasinventories2093@gmail.com"
    - "davidc1205@gmail.com"

[project]
name = "sports-picks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.28.0",
    "scikit-learn>=1.6.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0",
    "nba_api>=1.11.0",
    "lightgbm>=4.0.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

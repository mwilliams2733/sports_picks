[project]
name = "sports-picks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    # uvicorn cannot serve /ws without a WebSocket transport: it answers
    # the upgrade with a plain 200 and the activity feed never connects.
    # Declared directly rather than via uvicorn[standard], which also
    # pulls uvloop (no Windows wheel), watchfiles and httptools that this
    # app does not use.
    "websockets>=13.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.28.0",
    "scikit-learn>=1.6.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "nba_api>=1.11.0",
    "lightgbm>=4.0.0",
    "scipy>=1.14.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.36.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
markers = [
    "allow_network: test genuinely needs real outbound network access",
]

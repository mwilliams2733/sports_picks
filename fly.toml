# fly.toml app configuration file generated for sports-picks on 2026-05-02T18:39:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sports-picks'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://sports-picks.fly.dev'
  DATABASE_PATH = '/data/sports_picks.db'
  ENABLE_SCHEDULER = '1'

[[mounts]]
  source = 'sports_picks_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

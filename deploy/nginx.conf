server {
    listen 80;
    server_name _;  # Replace with your domain: server_name picks.yourdomain.com;

    # API and WebSocket -> uvicorn
    location ~ ^/(picks|stats|backtest|games|props|health|pipeline|users|credits|ws) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Static assets
    location /assets/ {
        alias /opt/sports-picks/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend SPA - serve index.html for all other routes
    location / {
        root /opt/sports-picks/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}

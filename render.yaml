# Render Blueprint — declarative service config.
# After connecting this repo on https://dashboard.render.com, Render reads
# this file and provisions everything described below. Re-deploys on push.

services:
  - type: web
    name: sports-picks
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Starter plan: $7/mo, always-on (no sleep), 512MB RAM, shared CPU.
    # Required for the persistent disk below — free tier doesn't allow disks.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true

    # Persistent SSD mounted at /data. Survives redeploys, restarts, and plan
    # changes. 1GB is overkill for a SQLite betting DB (likely <100MB after a
    # year of daily picks/grades) but it's the smallest size Render offers.
    disk:
      name: sports-picks-data
      mountPath: /data
      sizeGB: 1

    envVars:
      # API key for The Odds API. Set the actual value in Render's dashboard
      # ("Environment" tab) — sync: false keeps it out of source.
      - key: ODDS_API_KEY
        sync: false

      # SQLite DB lives on the persistent disk so it survives redeploys.
      - key: DATABASE_PATH
        value: /data/sports_picks.db

      # CORS allow-list. Frontend is served by the same FastAPI process at
      # this domain, so cross-origin browser calls aren't expected. Keeping
      # the deployed origin here makes the rule explicit. Replace
      # YOUR-SLUG with the actual Render subdomain after first deploy.
      - key: ALLOWED_ORIGINS
        value: https://sports-picks.onrender.com

      # Start APScheduler inside the FastAPI lifespan: 8am ET morning_scout
      # (with 9/10am retries) + 3am ET recalibration. Always-on starter
      # plan keeps the process alive so the cron actually fires.
      - key: ENABLE_SCHEDULER
        value: "1"
